<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Primele 90 de Secunde — Bonus E-carte</title>
<style>
  :root {
    --bg: #FBF9F5; --ink: #17130E; --accent: #A63A2A;
    --bg-alt: #F0EDE6; --text-mid: #4a3f35; --border: #ddd6cb;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--ink); font-family: 'Georgia', serif; min-height: 100vh; }
  .brand-bar { background: var(--ink); color: #fff; text-align: center; padding: 12px 16px; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; }
  .brand-bar strong { color: var(--accent); }
  .container { max-width: 560px; margin: 0 auto; padding: 40px 16px 64px; text-align: center; }
  .icon { font-size: 48px; margin-bottom: 16px; }
  .bonus-badge { display: inline-block; background: var(--accent); color: #fff; font-size: 10px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; padding: 3px 10px; border-radius: 3px; margin-bottom: 12px; font-family: 'Helvetica Neue', sans-serif; }
  h1 { font-size: clamp(20px, 5vw, 28px); margin-bottom: 10px; }
  .subtitle { font-size: 15px; color: var(--text-mid); font-family: 'Helvetica Neue', sans-serif; line-height: 1.55; margin-bottom: 32px; }
  .btn {
    display: inline-block; background: var(--accent); color: #fff;
    text-decoration: none; font-size: 15px; font-weight: 700;
    letter-spacing: 0.07em; text-transform: uppercase;
    padding: 16px 32px; border-radius: 6px;
    font-family: 'Helvetica Neue', sans-serif;
    transition: opacity 0.15s;
  }
  .btn:hover { opacity: 0.88; }
  .note { margin-top: 24px; font-size: 12px; color: var(--text-mid); font-family: 'Helvetica Neue', sans-serif; }
  footer { margin-top: 64px; text-align: center; font-size: 11px; color: var(--border); font-family: 'Helvetica Neue', sans-serif; }
</style>
</head>
<body>
<div class="brand-bar"><strong>Bărbatul Magnetic</strong></div>
<div class="container">
  <div class="icon">🎁</div>
  <div class="bonus-badge">Bonus inclus gratuit</div>
  <h1>Primele 90 de Secunde</h1>
  <p class="subtitle">Șase situații, propoziție cu propoziție. Apasă butonul pentru a descărca PDF-ul și salvează-l pe dispozitivul tău.</p>
  <a href="primele-90-de-secunde-bonus.pdf" class="btn" download>Descarcă PDF Bonus</a>
  <p class="note">Fișier PDF · Doar pentru uz personal · Nu redistribui</p>
</div>
<footer>© 2026 Bărbatul Magnetic</footer>
</body>
</html>
